# nginx (host) → contenedor viajes-holy en 127.0.0.1:8090
#
# Instalación (reemplazar DOMINIO por el dominio real):
#   sudo cp deploy/nginx-viajes-holy.conf /etc/nginx/sites-available/viajes-holy
#   sudo sed -i 's/DOMINIO/midominio.com/g' /etc/nginx/sites-available/viajes-holy
#   sudo ln -s /etc/nginx/sites-available/viajes-holy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d midominio.com -d www.midominio.com
#
# Certbot añade el bloque 443 + certificados y la redirección HTTP→HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;
    server_tokens off;

    # Subidas de plantillas (las fotos van directo a Supabase Storage,
    # pero el JSON puede ser grande). Debe ser >= MAX_BODY_MB del server.
    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
